# Halt attempt built on the EXACT settings that read IDCODE reliably (idcode.cfg):
# reset_config none, minimal tap (-ignore-version), then add an arm7tdmi target.
# Goal: if we can halt, we can read flash 0x3FB0 / 0x100230 directly over JTAG
# (safe, no write, no erase, no risky routineId).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -data 0x0010
transport select jtag
reset_config none
adapter speed 100

jtag newtap tms470 cpu -irlen 4 -ignore-version
target create tms470.cpu arm7tdmi -endian big -chain-position tms470.cpu

init
echo "=== scan_chain ==="
scan_chain
echo "=== targets (before) ==="
targets
echo "=== low-level IR/DR sanity: load BYPASS (0xF) then read 32-bit DR ==="
irscan tms470.cpu 0xf
drscan tms470.cpu 8 0x00
echo "=== attempt halt ==="
catch { halt }
echo "=== targets (after) ==="
targets
echo "=== try a memory read at reset vector ==="
catch { mdw 0x00000000 4 }
echo "=== try SRAM base 0x00400000 ==="
catch { mdw 0x00400000 4 }
shutdown
