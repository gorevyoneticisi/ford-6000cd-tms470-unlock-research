# Halt the TMS470, skipping OpenOCD's buggy IR-capture chain validation (irmask 0).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -data 0x0010
transport select jtag
reset_config none
adapter speed 100

jtag newtap tms470 cpu -irlen 4 -ircapture 0x1 -irmask 0x0 -expected-id 0x3100e02f
target create tms470.cpu arm7tdmi -chain-position tms470.cpu -endian little

init
echo "=== halt ==="
halt
echo "=== target state ==="
targets
echo "=== reset vectors @ 0x0 ==="
mdw 0x00000000 8
echo "=== 0x3FC0 ==="
mdw 0x00003fc0 8
echo "=== 0x100220 ==="
mdw 0x00100220 8
echo "=== resume ==="
resume
shutdown
