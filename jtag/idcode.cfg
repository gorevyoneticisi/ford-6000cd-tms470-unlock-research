# Raw JTAG IDCODE scan for the TMS470R1VF689 (ARM7TDMI) via an FT232H.
# Non-destructive: this only clocks the TAP and reads its ID register.
#
# FT232H wiring (MPSSE, fixed):
#   AD0 -> TCK (chip pin 54)
#   AD1 -> TDI (chip pin 52)
#   AD2 -> TDO (chip pin 53)
#   AD3 -> TMS (chip pin 11)
#   AD4 -> nTRST (chip pin 100)        <- released high by this config
#   GND -> radio GND ; FT232H VREF -> radio 3.3V
#
# Run:  openocd -f idcode.cfg
# Expect: a printed IDCODE like 0x........ for "tms470.cpu".
# All-zero or all-one / "JTAG scan chain interrogation failed" => TAP not
# responding (JTAG off, TRST held low, TEST high, or a wiring issue).

adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
# low byte: AD0 TCK(out) AD1 TDI(out) AD2 TDO(in) AD3 TMS(out) AD4 nTRST(out)
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -data 0x0010

transport select jtag
reset_config none
adapter speed 100

# ARM7TDMI has a 4-bit instruction register
jtag newtap tms470 cpu -irlen 4 -ignore-version

init
scan_chain
shutdown
