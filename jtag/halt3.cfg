# Mainline OpenOCD, TMS470R1 arm7tdmi, big-endian (per TI OpenOCD-devel thread).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -data 0x0010
transport select jtag
reset_config trst_only
adapter speed 100

jtag newtap tms470 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x3100e02f
target create tms470.cpu arm7tdmi -endian big -chain-position tms470.cpu

init
echo "=== halt ==="
halt
targets
echo "=== reset vectors @ 0x0 ==="
mdw 0x00000000 8
echo "=== 0x3FC0 (should be flash) ==="
mdw 0x00003fc0 8
echo "=== 0x100220 ==="
mdw 0x00100220 8
echo "=== resume ==="
resume
shutdown
