# Halt the TMS470 ARM7TDMI and read memory (read-only).
# TAP params per the known-good config for IDCODE 0x3100e02f (TI ARM7TDMI TAP).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -data 0x0010
transport select jtag
reset_config none
adapter speed 100

jtag newtap tms470 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x3100e02f
target create tms470.cpu arm7tdmi -chain-position tms470.cpu -endian little

init
echo "=== halting CPU ==="
halt
echo "=== reset vectors @ 0x00000000 ==="
mdw 0x00000000 8
echo "=== flash @ 0x00003FC0 ==="
mdw 0x00003fc0 8
echo "=== @ 0x00100220 ==="
mdw 0x00100220 8
echo "=== resume + done ==="
resume
shutdown
