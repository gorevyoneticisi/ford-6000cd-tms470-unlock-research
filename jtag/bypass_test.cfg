# Low-level TDI test: skip IR-capture validation, manually load instructions.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -data 0x0010
transport select jtag
reset_config none
adapter speed 100

jtag newtap tms470 cpu -irlen 4 -ircapture 0x1 -irmask 0x0 -expected-id 0x3100e02f
init

echo "=== 1) default DR after TLR (expect IDCODE 0x3100e02f) ==="
drscan tms470.cpu 32 0x0

echo "=== 2) load BYPASS (IR=0xF), shift 0xAA through 8-bit DR ==="
echo "    if TDI loads instructions: DR becomes 1 bit, 0xAA passes through delayed"
echo "    if TDI is dead: IR stays IDCODE, we still read 32-bit IDCODE data"
irscan tms470.cpu 0xf
drscan tms470.cpu 8 0xaa

echo "=== 3) re-read DR after BYPASS (1-bit shift pattern) ==="
drscan tms470.cpu 8 0x55

echo "=== 4) load IDCODE instr (IR=0xE), read 32 again ==="
irscan tms470.cpu 0xe
drscan tms470.cpu 32 0x0

shutdown
