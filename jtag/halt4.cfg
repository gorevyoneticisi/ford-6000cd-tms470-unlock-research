# Try the TMS470 dual-TAP (TI scan-based emulation): declare TAP2 + TAP1 (ARM).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -data 0x0010
transport select jtag
reset_config trst_only
adapter speed 100

# two TAPs in the chain (TDI -> tap2 -> cpu -> TDO ordering; swap if it complains)
jtag newtap tms470 tap2 -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x3100e02f
jtag newtap tms470 cpu  -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x3100e02f
target create tms470.cpu arm7tdmi -endian big -chain-position tms470.cpu

init
echo "=== halt ==="
halt
targets
mdw 0x00000000 4
resume
shutdown
